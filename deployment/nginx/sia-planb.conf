# Production site config; installed as /etc/nginx/sites-available/sia-planb.
# React releases live in /var/www/sia-planb/releases/<sha>; `current` is a symlink.

# HTTP: status → UptimeRobot
server {
    listen 80;
    listen [::]:80;
    server_name status.sia-planb.de;
    return 301 https://stats.uptimerobot.com/KI1HUbkBQv;
}

# HTTP → HTTPS for main site
server {
    listen 80;
    listen [::]:80;
    server_name sia-planb.de www.sia-planb.de;
    return 301 https://sia-planb.de$request_uri;
}

# HTTP: mail → main site
server {
    listen 80;
    listen [::]:80;
    server_name mail.sia-planb.de;
    return 301 https://sia-planb.de$request_uri;
}

# HTTPS: React frontend/API + mail redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sia-planb.de www.sia-planb.de mail.sia-planb.de;

    ssl_certificate     /etc/letsencrypt/live/sia-planb.de-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sia-planb.de-0002/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = mail.sia-planb.de) {
        return 301 https://sia-planb.de$request_uri;
    }

    root /var/www/sia-planb/current;
    index index.html;
    client_max_body_size 8M;

    proxy_redirect http://127.0.0.1 https://sia-planb.de;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /;

    error_page 503 = /maintenance.html;
    error_page 502 503 504 /maintenance.html;
    location /maintenance.html {
        root /var/www/html/;
        index maintenance.html;
    }

    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain image/png text/css application/javascript text/javascript text/calendar application/json image/jpeg application/octet-stream image/vnd.microsoft.icon video/mp4 model/gltf-binary;

    location /api/ {
        proxy_pass http://127.0.0.1:5005;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:5005;
    }

    location = /events.ics {
        proxy_pass http://127.0.0.1:5005;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:5005;
    }

    location /calendar {
        proxy_pass http://127.0.0.1:5005;
    }

    location /verify_mail {
        proxy_pass http://127.0.0.1:5005;
    }

    location /verify_hs_mail {
        proxy_pass http://127.0.0.1:5005;
    }

    location /verify_student_membership {
        proxy_pass http://127.0.0.1:5005;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: status.sia-planb.de → UptimeRobot directly
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.sia-planb.de;

    ssl_certificate     /etc/letsencrypt/live/sia-planb.de-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sia-planb.de-0002/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://stats.uptimerobot.com/KI1HUbkBQv;
}
