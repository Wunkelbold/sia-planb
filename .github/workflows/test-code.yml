name: Test Code

on:
  workflow_call:

permissions:
  contents: read

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: cp sia-backend/.env.example sia-backend/.env
      - name: Run smoke tests
        run: >-
          docker compose
          --project-name sia-planb-ci
          --file sia-backend/compose.yml
          --env-file sia-backend/.env
          --profile test
          up --build --abort-on-container-exit --exit-code-from test test
      - name: Remove test containers and volumes
        if: always()
        run: >-
          docker compose
          --project-name sia-planb-ci
          --file sia-backend/compose.yml
          --env-file sia-backend/.env
          --profile test
          down --volumes --remove-orphans
