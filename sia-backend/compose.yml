services:
  database:
    image: ${DATABASE_IMAGE:-sia-planb-database:dev}
    ports:
      - "127.0.0.1:5432:5432" #TODO REMOVE ON PRODUCTION
    build: ./database-server
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 10

  flask:
    image: ${FLASK_IMAGE:-sia-planb-flask:dev}
    build: ./flask-server 
    ports:
      - "127.0.0.1:5005:80"
      - "127.0.0.1:9191:9191"
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_URI: postgresql+psycopg2://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}/${DATABASE_NAME}
      DROP_AND_CREATE_DATABASE: "false"
      CREATE_ADMIN: "false"
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      HOSTNAME: ${HOSTNAME}
      hostname: ${hostname}
      UPDATE_MAIL_USER: ${UPDATE_MAIL_USER:-false}
    volumes:
      - eventposter:/opt/flask-backend/static/images/eventposter
      - ${MAIL_ACCOUNTS_FILE_HOST:-./mail-server/docker-data/dms/config/postfix-accounts.cf}:/app/postfix-accounts.cf
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: "curl -fs http://localhost 2>&1 > /dev/null"
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${FLASK_IMAGE:-sia-planb-flask:dev}
    build: ./flask-server
    command: flask --app app db upgrade
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_URI: postgresql+psycopg2://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}/${DATABASE_NAME}
      DROP_AND_CREATE_DATABASE: "false"
      CREATE_ADMIN: "false"
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      HOSTNAME: ${HOSTNAME}
      hostname: ${hostname}
      UPDATE_MAIL_USER: "false"
      SKIP_STARTUP_DATA: "true"
      SECRET_KEY: ${SECRET_KEY}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      database:
        condition: service_healthy


  test:
    build: ./test
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_NAME=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
      flask:
        condition: service_healthy
    profiles:
      - test

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    # Provide the FQDN of your mail server here (Your DNS MX record should point to this value)
    hostname: ${hostname} 
    env_file: ${MAILSERVER_ENV_FILE:-./mail-server/mailserver.env}
    # More information about the mail-server ports:
    # https://docker-mailserver.github.io/docker-mailserver/latest/config/security/understanding-the-ports/
    ports:
      - "25:25"    # SMTP  (explicit TLS => STARTTLS, Authentication is DISABLED => use port 465/587 instead)
      - "143:143"  # IMAP4 (explicit TLS => STARTTLS)
      - "465:465"  # ESMTP (implicit TLS)
      - "587:587"  # ESMTP (explicit TLS => STARTTLS)
      - "993:993"  # IMAP4 (implicit TLS)
    volumes:
      - ${MAIL_DATA_PATH:-./mail-server/docker-data/dms/mail-data}:/var/mail/
      - ${MAIL_STATE_PATH:-./mail-server/docker-data/dms/mail-state}:/var/mail-state/
      - ${MAIL_LOG_PATH:-./mail-server/docker-data/dms/mail-logs}:/var/log/mail/
      - ${MAIL_CONFIG_PATH:-./mail-server/docker-data/dms/config}:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
      - /etc/letsencrypt/:/etc/letsencrypt/ 
      - /etc/ssl/mailserver/:/etc/ssl/mailserver/  # TODO REMOVE ON PRODUCTION
    environment:
      - SSL_TYPE=${SSL_TYPE}
      - SSL_CERT_PATH=/etc/ssl/mailserver/mailserver.crt # TODO PROD REMOVE
      - SSL_KEY_PATH=/etc/ssl/mailserver/mailserver.key # TODO PROD REMOVE
    restart: always
    stop_grace_period: 1m
    # Uncomment if using `ENABLE_FAIL2BAN=1`:
    # cap_add:
    #   - NET_ADMIN
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      timeout: 3s
      interval: 10s
      retries: 1
volumes:
  pgdata:
  eventposter:
